# Coach d'ouvertures : interface Angular (frontend), API FastAPI + LangGraph (api),
# chargement du corpus (openings-loader) et Milvus standalone (standalone, etcd, minio).
# Démarrage : docker compose up -d --build   puis   http://localhost:4200

x-backend: &backend
  image: chess-agent-api
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  volumes:
    - ./data:/app/data:ro
    - hf_cache:/root/.cache/huggingface

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthcheck', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
      start_interval: 5s
    depends_on:
      openings-loader:
        condition: service_completed_successfully
      standalone:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: loads data/openings.json into Milvus when the collection is empty
  # (first start), does nothing otherwise. It also downloads the embedding
  # model into hf_cache before the api starts.
  openings-loader:
    <<: *backend
    command: ["python", "-m", "api.scripts.load_openings", "--if-empty"]
    depends_on:
      standalone:
        condition: service_healthy
    restart: "no"

  milvus-volume-init:
    image: milvusdb/milvus:v3.0.2
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          echo "Preparing /var/lib/milvus for $${uid}:$${gid}"
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - milvus_data:/var/lib/milvus

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
      start_interval: 5s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
      start_interval: 5s
    restart: unless-stopped

  standalone:
    image: milvusdb/milvus:v3.0.2
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
      start_interval: 5s
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  milvus_data:
  etcd_data:
  minio_data:
  hf_cache:
