server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Backend: same origin as the app, so no CORS. Without a URI after the
    # host, nginx forwards the path as received (encoded "/" of FENs included).
    # "^~": API paths never fall into the static files rule below.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # First searches may include YouTube calls and the embedding model warm-up.
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
